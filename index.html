<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voting App</title>
  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-6">

  <div class="vote-card">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Cast Your Vote</h1>

    <form id="vote-form" class="space-y-6">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
        <div class="flex-1">
          <label for="voter-name" class="mb-1 block text-sm font-medium text-gray-700">Enter Name</label>
          <input id="voter-name" name="voter-name" type="text" placeholder="Voter" class="form-control">
        </div>
        <div class="flex-1">
          <label for="candidate" class="mb-1 block text-sm font-medium text-gray-700">Candidates</label>
          <select id="candidate" name="candidate" class="form-control">
            <option value="" disabled selected>Select a candidate</option>
            <option value="candidate-a">Augustine</option>
            <option value="candidate-b">kosy</option>
          </select>
        </div>
      </div>

      <button type="submit" class="primary-button">Submit Vote</button>
    </form>

    <div class="mt-10 flex items-center justify-between">
      <div class="flex flex-col items-center gap-1">
        <button type="button" id="check-result-btn" class="result-button" aria-haspopup="dialog"
          aria-controls="result-dialog">
        </button>
        <span class="text-xs text-gray-500">Check Result</span>
      </div>

      <div class="flex flex-col items-center gap-1">
        <div class="vote-count" id="vote-count">128</div>
        <span class="text-xs text-gray-500">Total votes</span>
      </div>
    </div>

    <dialog id="result-dialog" class="modal-panel backdrop:bg-gray-900/50">
      <div class="flex items-center gap-3 border-b border-gray-200 px-6 py-4">
        <div class="flex size-10 items-center justify-center rounded-full bg-blue-50 text-brand-500">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.29 0 4.544.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-1.5.174m1.5-.174v-3.75" />
          </svg>
        </div>
        <h2 class="text-lg font-semibold text-gray-900">Result</h2>
      </div>

      <div class="space-y-3 px-6 py-5">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Winner</span>
          <span class="font-semibold text-gray-900">Candidate A</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Winner Votes</span>
          <span class="font-semibold text-gray-900">XX</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Total Votes</span>
          <span class="font-semibold text-gray-900">XX</span>
        </div>
      </div>

      <div class="border-t border-gray-200 px-6 py-4 text-right">
        <button type="button" id="close-result-btn" class="primary-button">Close</button>
      </div>
    </dialog>

    <script>
      const voteForm = document.getElementById('vote-form');
      const checkResultBtn = document.getElementById('check-result-btn');
      const closeResultBtn = document.getElementById('close-result-btn');
      const resultDialog = document.getElementById('result-dialog');

      voteForm.addEventListener('submit', (e) => e.preventDefault());

      checkResultBtn.addEventListener('click', () => resultDialog.showModal());
      closeResultBtn.addEventListener('click', () => resultDialog.close());

      resultDialog.addEventListener('click', (event) => {
        const rect = resultDialog.getBoundingClientRect();
        const clickedOutside =
          event.clientX < rect.left ||
          event.clientX > rect.right ||
          event.clientY < rect.top ||
          event.clientY > rect.bottom;
        if (clickedOutside) resultDialog.close();
      });
    </script>


</body>

</html>
