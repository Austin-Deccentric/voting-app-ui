<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voting App</title>
  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-6">

  <div class="vote-card">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Cast Your Vote</h1>

    <form id="vote-form" class="space-y-6">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
        <div class="flex-1">
          <label for="voter-name" class="mb-1 block text-sm font-medium text-gray-700">Enter Name</label>
          <input id="voter-name" name="voter-name" type="text" placeholder="Voter" class="form-control" required>
        </div>
        <div class="flex-1">
          <label for="candidate" class="mb-1 block text-sm font-medium text-gray-700">Candidates</label>
          <select id="candidate" name="candidate" class="form-control" required>
            <option value="" disabled selected>Select a candidate</option>
          </select>
        </div>
      </div>

      <button id= "vote-button" type="submit" class="primary-button">Submit Vote</button>
    </form>

    <div class="mt-10 flex items-center justify-between">
      <div class="flex flex-col items-center gap-1">
        <button type="button" id="check-result-btn" class="result-button" aria-haspopup="dialog"
          aria-controls="result-dialog">
        </button>
        <span class="text-xs text-gray-500">Check Result</span>
      </div>

      <div class="flex flex-col items-center gap-1">
        <div class="vote-count" id="vote-count">128</div>
        <span class="text-xs text-gray-500">Total votes</span>
      </div>
    </div>

    <dialog id="result-dialog" class="modal-panel backdrop:bg-gray-900/50">
      <div class="flex items-center gap-3 border-b border-gray-200 px-6 py-4 justify-center">
        <!-- <div class="flex size-10 items-center justify-center rounded-full bg-blue-50 text-brand-500">
        </div> -->
        <h2 class="text-lg font-semibold text-gray-900">Result</h2>
      </div>

      <div class="space-y-3 px-6 py-5">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Winner: </span>
          <span id = "result-winner" class="font-semibold text-gray-900"> Candidate A</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Winner Votes</span>
          <span id= "result-winner-votes" class="font-semibold text-gray-900">XX</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Total Votes</span>
          <span id="result-total-votes" class="font-semibold text-gray-900">XX</span>
        </div>
      </div>

      <div class="border-t border-gray-200 px-6 py-4 text-right">
        <button type="button" id="close-result-btn" class="primary-button">Close</button>
      </div>
    </dialog>
    <script type="module" src="./dist/main.js"></script>
</body>

</html>
